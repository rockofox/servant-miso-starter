name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-ui:
    name: Build WASM Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v18

      - name: Cache WASM cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            ~/.ghc-wasm/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-wasm-${{ hashFiles('flake.lock', 'cabal.project.ui', 'myapp-ui/**/*.cabal', 'myapp-api/**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Build WASM frontend
        run: nix develop .#wasm --command ./scripts/build-ui.sh

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-frontend
          path: myapp-ui/static/
          retention-days: 14
          overwrite: true

  build-server:
    name: Build Server Image
    runs-on: ubuntu-latest
    needs: build-ui
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-frontend
          path: myapp-ui/static/

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v18

      # Builds only myapp-api + myapp-server (deps come from cache.nixos.org).
      - name: Build server image (Nix)
        run: nix build .#myapp-server-image-stream --print-build-logs

      - name: Compute sha tag
        id: tags
        run: echo "sha=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push image to GHCR (main only)
        if: github.event_name == 'push'
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/myapp-server
        run: |
          set -euo pipefail
          ./result > /tmp/myapp-server.tar
          for tag in latest main "${{ steps.tags.outputs.sha }}"; do
            nix run nixpkgs#skopeo -- copy --insecure-policy \
              docker-archive:/tmp/myapp-server.tar \
              "docker://$IMG:$tag"
          done
